name: generate snake

# Builds the contribution-snake SVGs used at the bottom of README.md and
# publishes them to the `output` branch. Uses GITHUB_TOKEN only (no PAT).
# Note: GitHub pauses scheduled workflows in public repos after 60 days with
# no repository activity. The push trigger below re-runs it on any README edit;
# otherwise re-enable it from the Actions tab.

on:
  schedule:
    - cron: "17 0 * * *" # daily, off the hour to avoid queue spikes
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate github-snake svgs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2563EB&color_dots=#ebedf0,#bfdbfe,#93c5fd,#60a5fa,#2563eb
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF7400&color_dots=#161b22,#0e3a4f,#1f6f8f,#3fa3cf,#66ccff

      # This step force-replaces the `output` branch on every run.
      # Never let a second workflow push to `output`.
      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore(snake): regenerate contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
